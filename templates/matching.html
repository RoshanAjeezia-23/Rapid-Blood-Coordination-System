<!DOCTYPE html>
<html>
<head>
    <title>Smart Donor Matching</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
        }

        .matching-box {
            background-color: white;
            width: 400px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 10px;
        }

        select {
            width: 90%;
            padding: 12px;
            margin: 15px;
        }

        button {
            background-color: #b30000;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="matching-box">

        <h1>Smart Donor Matching</h1>

        <p>Select Required Blood Group</p>

        <form method="POST" action="/matching">

            <select name="blood_group" required>

                <option value="">Select Blood Group</option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>

            <br>

            <button type="submit">Find Matching Donor</button>

        </form>


        {% if donors %}

        <div class="result">

            <h3>Matching Donor Found</h3>

            <p>
                {{ donors|length }} matching donor(s) available.
            </p>

        </div>

        {% elif request.method == "POST" %}

        <div class="result">

            <h3>No Matching Donor</h3>

            <p>No donor is currently available for this blood group.</p>

        </div>

        {% endif %}

    </div>

</body>
</html>
